[[language]]
name = "cpp"
file-types = [
  "cc", "hh", "c++", "cpp", "hpp", "h", "ipp", "tpp", "cxx", "hxx", "ixx", "txx", "ino",
  "C", "H", "cu", "cuh", "cppm", "h++", "ii", "inl",
  { glob = ".hpp.in" }, { glob = ".h.in" },
  "hip",
]
# Match .clang-format (IndentWidth: 4).
indent = { tab-width = 4, unit = "    " }
